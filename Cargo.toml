[workspace]
resolver = "2"
members = [
    "crates/opendeck-core",
    "crates/opendeck-analysis",
    "crates/opendeck-db",
    "crates/opendeck-audio",
    "crates/opendeck-hardware",
    "crates/opendeck-ui",
]

[workspace.dependencies]
# Core & Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }

# Parser XML Rekordbox (rekordbox.xml)
roxmltree = "0.19"
chrono = "0.4"

# Análise de Arquivos (.DAT)
byteorder = "1.5"
memmap2 = "0.9"

# Áudio (Cross-platform: WASAPI/ASIO no Win, ALSA/PipeWire no Linux)
cpal = "0.15"

# Hardware (MIDI/USB)
midir = "0.9"
rusb = "0.9"

# UI (Tauri)
tauri = { version = "2.0", features = [] }